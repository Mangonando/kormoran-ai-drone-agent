# Kormoran default runtime configuration.
# Values here are informational only — runtime config comes from Settings
# (pydantic-settings, environment variables, .env file).
# See .env.example for the canonical list of env vars.

llm_model: openai/gpt-4o-mini
llm_timeout_s: 30
max_llm_calls: 40
max_cost_usd: 0.50
max_steps: 50
max_mission_s: 300

sim_gui: false
data_dir: ./data
record_missions: true
log_level: INFO

geofence_x_min: -2.7
geofence_x_max: 2.7
geofence_y_min: -2.7
geofence_y_max: 2.7
geofence_z_min: 0.1
geofence_z_max: 2.2
