scene_id: apartment_v1
# 20 m² apartment — three progressively harder targets separated by wall-height dividers.
# The dividers (2.8 m tall) exceed the drone geofence ceiling (2.2 m), so the drone cannot
# fly over them; it must discover and navigate through the gaps.
#
# Top-down layout (x = east / forward from start, y = north):
#
#   y  2.0 ┌────────────────────────────────────┐
#          │                                    │
#      0.5 │   ZONE A     gap-1 ║  ZONE B       │
#          │  [blue sphere]     ║  [yel. cyl.]  │
#      0.0 │★ START             ║               │
#          │              ══════╣  gap-2        │
#     -0.5 │                    ╠═══════════════│
#          │                    ║         ZONE C│
#     -2.0 └────────────────────╨──[red cube]───┘
#         x=-2.5              x=0.0  x=1.5    x=2.5
#
# Difficulty progression:
#   Target 1 — blue sphere   : Zone A, same zone as start — needs a scan + advance
#   Target 2 — yellow cylinder: Zone B — drone must find the north gap (y > 0.5) at x=0
#   Target 3 — red cube      : Zone C — drone must also find the south gap (y < -0.5) at x=1.5
#
# Geofence note: the default Settings geofence (±2.7 m XY) is wider than this room.
# For proper containment run with:
#   GEOFENCE_X_MIN=-2.2 GEOFENCE_X_MAX=2.2 GEOFENCE_Y_MIN=-1.7 GEOFENCE_Y_MAX=1.7
# (This will be handled automatically when per-scenario geofence override lands in M5.)

room:
  x: [-2.5, 2.5]
  y: [-2.0, 2.0]
  z: [0.0, 3.0]
obstacles:
  # Wall-1: divider at x=0, covers y=[-2.0, 0.5] — gap at y=[0.5, 2.0] (north)
  # Height 2.3 m: above geofence ceiling (2.2 m) so drone cannot fly over,
  # but low enough for a clean top-down recording view.
  - shape: box
    size: [0.15, 2.5, 2.3]
    pose: [0.0, -0.75, 1.15]

  # Wall-2: divider at x=1.5, covers y=[-0.5, 2.0] — gap at y=[-2.0, -0.5] (south)
  - shape: box
    size: [0.15, 2.5, 2.3]
    pose: [1.5, 0.75, 1.15]

targets:
  # Target 1 — easiest: visible from the start zone after one scan
  - label: blue sphere
    shape: sphere
    color: blue
    size: 0.2
    zone: [[-2.2, -0.3], [-1.5, 1.5], [0.5, 0.5]]

  # Target 2 — medium: Zone B, requires navigating through the north gap of wall-1
  - label: yellow cylinder
    shape: cylinder
    color: yellow
    size: 0.25
    zone: [[0.3, 1.3], [-1.5, 1.5], [0.5, 0.5]]

  # Target 3 — hardest: Zone C, requires navigating through both gaps (north then south)
  - label: red cube
    shape: cube
    color: red
    size: 0.2
    zone: [[1.7, 2.2], [-1.5, 1.5], [0.5, 0.5]]

start_pose: [-2.0, 0.0, 0.0, 0.0]
