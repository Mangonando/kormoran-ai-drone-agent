[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kormoran"
version = "0.1.0"
description = "LLM-driven drone agent for autonomous object search in simulation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
]

[project.scripts]
kormoran = "kormoran.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kormoran"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "ANN"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (no sim, no network, < 10 s total)",
    "sim: integration tests requiring the headless simulator",
    "llm: tests requiring OPENROUTER_API_KEY (auto-skipped when unset)",
    "slow: slow tests",
]
testpaths = ["tests"]
