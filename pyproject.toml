[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kormoran"
version = "0.1.0"
description = "LLM-driven drone agent for autonomous object search in simulation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "pybullet==3.2.7",
    "gym-pybullet-drones @ git+https://github.com/learnsyslab/gym-pybullet-drones@7ebad1ecabd28a7000add2d05f888aa2e837c2cc",
    "torch",  # explicit so [tool.uv.sources] can redirect to CPU-only index
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
    "langgraph>=0.2",
    "chromadb",
]

[project.scripts]
kormoran = "kormoran.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kormoran"]

[tool.hatch.metadata]
allow-direct-references = true

# pybullet 3.2.7 does not build from source on macOS arm64 + Xcode ≥21 due to
# a vendored zutil.h issue. We ship a patched pre-built wheel in wheels/.
# On Linux (CI / Docker) uv ignores this because the wheel tag doesn't match.
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# macOS arm64: patched local wheel (not in git — build once with `make setup-wheel`).
# Linux / CI: falls back to the PyPI sdist, which builds cleanly with gcc.
pybullet = [
    { path = "wheels/pybullet-3.2.7-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]
# CPU-only torch: gym-pybullet-drones pulls torch transitively; we never need CUDA
# (headless sim only). This avoids downloading ~2 GB of Nvidia packages in Docker/CI.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ANN"]
ignore = ["ANN101", "ANN102"]  # self/cls annotations — removed in ruff 0.7+

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "ANN"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (no sim, no network, < 10 s total)",
    "sim: integration tests requiring the headless simulator",
    "llm: tests requiring OPENROUTER_API_KEY (auto-skipped when unset)",
    "slow: slow tests",
]
testpaths = ["tests"]
